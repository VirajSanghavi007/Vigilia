services:
  memgraph:
    # memgraph-mage (not plain memgraph) bundles the MAGE algorithm
    # library — Memgraph Lab's GraphChat (natural-language-to-Cypher)
    # requires it to be present, otherwise it refuses to start querying.
    image: memgraph/memgraph-mage:latest
    ports:
      - "7687:7687"  # bolt — driver connections
      - "7444:7444"  # memgraph logging/monitoring endpoint
    volumes:
      - memgraph_data:/var/lib/memgraph
      # Sharded CSVs for LOAD CSV-based bulk-load benchmarking — Memgraph's
      # own fastest documented ingestion path reads files server-side, so
      # the shards need to exist inside the container's filesystem, not
      # just be reachable from the Python client. Read-only: this script
      # only ever reads shards here, host-side scripts write them.
      - ./data/syndata/csv_shards:/csv_shards:ro

  memgraph-lab:
    image: memgraph/lab:2.16.0
    ports:
      - "3000:3000"  # web UI for browsing/querying the graph
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: "7687"
    depends_on:
      - memgraph

volumes:
  memgraph_data:
