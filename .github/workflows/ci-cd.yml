name: CI/CD

on:
  push:
    branches:
      - development
      - production

permissions:
  contents: read
  security-events: write

env:
  UV_VERSION: "0.12.13"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.2.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync deps (core + dev, locked)
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check src tests

  # ── Unit tests (fast, no torch) — both branches ─────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.2.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync deps (core + dev, locked)
        run: uv sync --locked --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit -v

  # ── Smoke tests (loads model, one input, checks output) — production only ──
  smoke-tests:
    name: Smoke tests
    if: github.ref == 'refs/heads/production'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.2.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync deps (core + ml + dev, locked)
        run: uv sync --locked --extra ml --group dev

      - name: Run smoke tests
        run: uv run pytest tests/smoke -v

  # ── Integration tests (API endpoints) — production only ────────────────────
  integration-tests:
    name: Integration tests
    if: github.ref == 'refs/heads/production'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.2.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync deps (core + dev, locked)
        run: uv sync --locked --group dev

      # GitHub-hosted service containers (the `services:` job key) only work on
      # Linux runners — Windows/macOS runners have no Docker daemon available
      # to the job. So on Linux we spin up a real Postgres here and point
      # DATABASE_URL at it; on Windows there's deliberately no DB, and the
      # DB-backed tests skip themselves via the `pg_available` fixture in
      # conftest.py rather than failing against a dead connection.
      - name: Start Postgres (Linux only)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg-test \
            -e POSTGRES_USER=placeholder -e POSTGRES_PASSWORD=placeholder -e POSTGRES_DB=placeholder \
            -p 5432:5432 postgres:16
          for i in $(seq 1 30); do
            docker exec pg-test pg_isready -U placeholder && break
            sleep 1
          done

      - name: Run integration tests
        run: uv run pytest tests/integration -v

  # ── Security scanning ────────────────────────────────────────────────────
  security:
    name: Security scanning
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5.2.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync deps (core + dev, locked)
        run: uv sync --locked --group dev

      - name: Bandit (static security lint)
        run: uv run bandit -r src --severity-level medium

      # `uv sync` venvs don't ship a `pip` module (uv installs packages
      # itself) — the pip-audit action shells out to `python -m pip` inside
      # whatever VIRTUAL_ENV setup-uv exported, so without this it fails
      # with "No module named pip" before it ever gets to scanning.
      - name: Ensure pip is present for the pip-audit action
        run: uv pip install pip

      # pip-audit's `inputs` expects a pip requirements.txt-style file, but
      # uv.lock is TOML — pointing it at uv.lock directly fails parsing on
      # line 1 ("version = 1" isn't a valid requirement specifier). Exported
      # WITHOUT --all-extras/--extra ml deliberately: this job never syncs
      # the ml extra (torch's CPU build isn't on plain PyPI, so pip-audit's
      # resolver can't find `torch==...+cpu` to install and audit it) — this
      # audits exactly what this job's venv actually has installed.
      - name: Export lockfile to requirements format
        run: uv export --locked --no-hashes --group dev -o requirements-audit.txt

      - name: pip-audit (dependency vulnerabilities)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-audit.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.27.9
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3.27.9

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3.27.9

  # ── Docker build ─────────────────────────────────────────────────────────
  # Builds the image exactly ONCE and scans that same build with Trivy —
  # previously `security` built its own throwaway `vigilia:scan` image
  # independently of this job's build, which was pure waste (every push
  # paid for two identical builds) and meant the image Trivy scanned was
  # never actually the candidate artifact this job produces.
  #
  # `needs` includes smoke-tests and integration-tests deliberately, even
  # though they only run on `production` (skipped, not failed, on
  # `development`) — this job is the thing `deploy` ships, so it should
  # depend on those gates directly instead of `deploy` re-checking them
  # after the image was already built. `always()` is required here because
  # by default a `needs:` job with result `skipped` auto-skips this job too;
  # we want to *tolerate* skip (expected on development) while still
  # blocking on an actual failure (`== 'success'` only, never `skipped`, for
  # lint/unit-tests/security, which always run).
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-22.04
    needs: [lint, unit-tests, security, smoke-tests, integration-tests]
    if: >-
      always() &&
      needs.lint.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.security.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.smoke-tests.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.integration-tests.result)
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Build image
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          push: false
          load: true
          tags: vigilia:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TEMPORARY diagnostic — two prior fix attempts (torch/torch_geometric
      # version bump, then forcing uv onto the base image's system Python
      # instead of a managed download) both left the exact same msgpack
      # 1.1.2 / setuptools 70.3.0 findings unchanged, which means neither
      # guess was the actual source. The table-format Trivy step below
      # doesn't report a file path per finding, so get JSON output with
      # PkgPath instead of guessing again. Remove once the real source is
      # identified and fixed.
      - name: Diagnose Trivy finding locations
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasecurity/trivy:0.70.0 image --format json --severity HIGH,CRITICAL \
            --scanners vuln vigilia:${{ github.sha }} > /tmp/trivy-diag.json
          python3 -c "
          import json
          d = json.load(open('/tmp/trivy-diag.json'))
          for r in d.get('Results') or []:
              for v in r.get('Vulnerabilities') or []:
                  if v['PkgName'] in ('msgpack', 'setuptools'):
                      print(r.get('Target'), '|', v['PkgName'], v.get('InstalledVersion'), '|', v.get('PkgPath'))
          "

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vigilia:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ── Continuous Delivery — production only, requires human approval ────────
  # Not pushing to a registry yet. This job exists purely as the manual
  # approval gate: it will not run a single step until someone approves the
  # "production" environment (Settings → Environments → production →
  # required reviewers). Wire in the real deploy command once a target
  # (registry push, HF Spaces, etc.) is decided.
  #
  # Only needs docker-build: that job's own `if:` already required
  # lint/unit-tests/security to succeed and smoke-tests/integration-tests to
  # succeed-or-skip, so re-checking all of them here would just be the same
  # condition twice.
  deploy:
    name: Deploy (production)
    runs-on: ubuntu-22.04
    needs: [docker-build]
    if: github.ref == 'refs/heads/production' && needs.docker-build.result == 'success'
    environment:
      name: production
    steps:
      - name: Deploy placeholder
        run: |
          echo "No deploy target configured yet — add the real deploy steps here."
          echo "This job only exists to require human approval before anything ships."
